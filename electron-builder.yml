appId: com.kite-agentic-trading.app
productName: Kite Agentic Trading
copyright: Copyright © 2026
icon: build/icon

directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - backend/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: backend_dist/
    to: backend_dist/
    filter:
      - "**/*"
mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  darkModeSupport: true
  icon: build/icon.icns
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
linux:
  target:
    - AppImage
    - deb
  category: Finance
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
