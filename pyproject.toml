[project]
name = "kite-agentic-trading"
version = "1.0.0"
description = "Agentic intraday trading app for Zerodha Kite"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "kiteconnect>=5.0.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "ta>=0.11.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.uv]
package = false
