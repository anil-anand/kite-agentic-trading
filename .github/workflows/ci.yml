name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Lint, format & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend/ run_backend.py

      - name: Ruff format check
        run: uv run ruff format --check backend/ run_backend.py

      - name: Run tests
        run: uv run pytest
