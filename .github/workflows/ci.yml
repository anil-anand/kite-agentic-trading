name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Lint, format & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend/ run_backend.py

      - name: Ruff format check
        run: uv run ruff format --check backend/ run_backend.py

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Lint, typecheck & build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # build:main + build:renderer are the TypeScript/renderer compile. The
        # full `build` also runs build:icon, which needs Python + Pillow to
        # generate a packaging asset — not relevant to a compile/type gate.
        run: npm run build:main && npm run build:renderer
